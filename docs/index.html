<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Desk · UI demo</title>
<meta name="description" content="Interactive UI demo of Order Desk, a Salesforce app (Apex + LWC). Sample data, runs offline in the browser.">
<style>
:root{--bg:#f3f3f3;--card:#fff;--text:#181818;--muted:#5c5c5c;--line:#e5e5e5;--soft:#f5f5f5;--foot:#fafafa;--brand:#0176d3;--brand-d:#014486;--tint:#eaf5fe;--active:#f6fbff;--err-bg:#fef1ee;--err:#ea001e;--err-t:#5c0b13;--ok-bg:#ebf7e6;--ok:#2e844a;--ok-t:#0d4a1f;--input:#c9c9c9;--note:#fff8e1;--note-b:#e0b400;--note-t:#4a3b00}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#1a212b;--text:#eef2f6;--muted:#a3adba;--line:#2b3542;--soft:#222b37;--foot:#161c25;--brand:#4aa3f0;--brand-d:#a8d4ff;--tint:#1b3550;--active:#17273a;--err-bg:#3a1a1c;--err:#ff7b86;--err-t:#ffd3d6;--ok-bg:#14301d;--ok:#5cc47b;--ok-t:#c9f0d4;--input:#3a4756;--note:#2f2a12;--note-b:#8a7413;--note-t:#f3e3a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.note{background:var(--note);border-bottom:1px solid var(--note-b);color:var(--note-t);padding:8px 16px;font-size:13px;text-align:center}
.note a{color:inherit;font-weight:600}
.desk{max-width:1120px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:16px 20px;margin-bottom:16px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:36px;height:36px;border-radius:8px;background:#ff5d2d;color:#fff;display:grid;place-items:center;font-size:18px}
h1{margin:0;font-size:20px}.sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
select,input{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--input);border-radius:4px;padding:7px 10px}
select{min-width:260px;max-width:100%}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.banner{display:flex;gap:8px;align-items:center;margin-bottom:16px;padding:10px 14px;border-radius:8px;font-size:14px}
.banner.err{background:var(--err-bg);border:1px solid var(--err);color:var(--err-t)}
.banner.ok{background:var(--ok-bg);border:1px solid var(--ok);color:var(--ok-t)}
.banner button{margin-left:auto;background:none;border:0;color:inherit;font-size:18px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:12px 16px}.stat small{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.stat span{display:block;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.ph{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:15px}
.badge{background:var(--tint);color:var(--brand-d);border-radius:999px;font-size:12px;font-weight:600;padding:1px 9px;min-width:24px;text-align:center}
ul{list-style:none;margin:0;padding:4px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 16px;border-left:3px solid transparent}
.row+.row{border-top:1px solid var(--soft)}.row.active{background:var(--active);border-left-color:var(--brand)}.row.done{opacity:.6}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mt{font-size:12px;color:var(--muted);margin-top:2px}
.qty{width:88px;text-align:right}
.pill{background:var(--soft);color:var(--muted);font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);background:var(--foot);border-radius:0 0 12px 12px}
.foot small{display:block;font-size:12px;color:var(--muted)}.foot b{font-size:15px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:4px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn[disabled]{background:#9a9a9a;cursor:not-allowed;opacity:.7}
.btn.full{width:100%;margin-top:12px}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px}.line+.line{border-top:1px solid var(--soft)}
.line .r{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}
.icon{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 4px;border-radius:4px}.icon:hover{color:var(--err)}
.checkout{padding:14px 16px 16px;border-top:1px solid var(--line);background:var(--foot);border-radius:0 0 12px 12px}
.total{display:flex;justify-content:space-between;font-size:16px;font-weight:700;margin-bottom:12px}
.checkout label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.checkout input{width:100%}
.hint{margin:4px 0 0;font-size:12px;color:var(--err)}
.empty{text-align:center;padding:32px 16px}.empty svg{width:72px;height:72px}.empty .h{font-weight:600;font-size:16px;margin:8px 0 0}.empty .m{margin:4px 0 0;font-size:13px;color:var(--muted)}
.section{margin-top:16px}
.hist .row{align-items:flex-start}
.status{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--tint);color:var(--brand-d)}
.status.Cancelled{background:var(--soft);color:var(--muted)}
.link{background:none;border:0;color:var(--brand);cursor:pointer;font:inherit;padding:0}
.link:hover{text-decoration:underline}
pre.mail{margin:0;padding:16px;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;border-top:1px solid var(--line)}
.mailhead{padding:12px 16px;font-size:13px;color:var(--muted)}.mailhead b{color:var(--text)}
footer{padding:8px 16px 24px;text-align:center;font-size:12px;color:var(--muted)}footer a{color:var(--brand)}
</style>
</head>
<body>
<div class="note">UI demo with sample data. The real app runs in Salesforce (Apex + Lightning Web Components); this page imitates its interface and rules in plain JavaScript. <a href="https://github.com/SimaKogan/order-desk">Source on GitHub</a></div>
<main class="desk" id="app"></main>
<footer>Order Desk by <a href="https://github.com/SimaKogan">Serafima Kogan</a> · all names and prices are fictional</footer>
<script>
"use strict";
// ---- sample data (mirrors scripts/apex/seed-demo-data.apex) -------------------------------------
const OPPS = [
  {id:"o1", name:"Northwind spring outfitting", account:"Northwind Traders", items:[
    {id:"i1", name:"Trail Backpack 30L", qty:6, price:89},
    {id:"i2", name:"Insulated Bottle 750ml", qty:20, price:24.5},
    {id:"i3", name:"Headlamp Pro", qty:10, price:39.9},
    {id:"i4", name:"Camp Stove Mini", qty:4, price:54},
    {id:"i5", name:"Merino Socks", qty:30, price:16}]},
  {id:"o2", name:"Fabrikam office refresh", account:"Fabrikam Studio", items:[
    {id:"i6", name:"Standing Desk 140cm", qty:5, price:420},
    {id:"i7", name:"Ergonomic Chair", qty:5, price:260},
    {id:"i8", name:"Monitor Arm", qty:8, price:75}]}
];
const state = {oppId:null, drafts:{}, purchases:[], seq:0, typed:{}, error:null, ok:null, email:"", lastMail:null};
const EMAIL = /^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/;
const money = n => new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n);
const $ = (tag, attrs={}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};

// ---- the same rules as OrderDeskService / PurchaseTriggerHandler ----------------------------------
const opp = () => OPPS.find(o => o.id === state.oppId);
const draft = () => state.drafts[state.oppId] || null;
function reserved(itemId){
  let sum = 0;
  for (const p of state.purchases) if (p.oppId === state.oppId && p.status !== "Cancelled")
    for (const l of p.lines) if (l.itemId === itemId) sum += l.qty;
  const d = draft(); if (d) for (const l of d.lines) if (l.itemId === itemId) sum += l.qty;
  return sum;
}
const available = item => Math.max(item.qty - reserved(item.id), 0);
function addToCart(){
  const wanted = Object.entries(state.typed).filter(([,q]) => q > 0);
  if (!wanted.length) throw new Error("Choose at least one product with a quantity above zero.");
  const o = opp();
  for (const [id,q] of wanted){
    const item = o.items.find(i => i.id === id), left = available(item);
    if (q > left) throw new Error(`"${item.name}" has only ${left} unit(s) left.`);
  }
  if (!state.drafts[o.id]) state.drafts[o.id] = {oppId:o.id, lines:[]};
  const d = state.drafts[o.id];
  for (const [id,q] of wanted){
    const item = o.items.find(i => i.id === id);
    const existing = d.lines.find(l => l.itemId === id);
    if (existing) existing.qty += q; else d.lines.push({itemId:id, name:item.name, qty:q, price:item.price});
  }
  state.typed = {};
}
function submit(){
  const d = draft();
  if (!d || !d.lines.length) throw new Error("Add at least one product before submitting the purchase.");
  if (!EMAIL.test(state.email.trim())) throw new Error("Enter a valid email address for the receipt.");
  const o = opp(), email = state.email.trim();
  const p = {id:"PUR-" + String(++state.seq).padStart(5,"0"), oppId:o.id, account:o.account, status:"Submitted", email, lines:d.lines};
  state.purchases.unshift(p); delete state.drafts[o.id];
  const rows = p.lines.map(l => ` - ${l.name}: ${l.qty} x ${l.price.toFixed(2)} = ${(l.qty*l.price).toFixed(2)}`);
  const total = p.lines.reduce((s,l) => s + l.qty*l.price, 0);
  state.lastMail = {to:email, subject:"Your receipt " + p.id,
    body:`Hello,\n\nThank you for your purchase, ${p.account}. Here is your receipt ${p.id}:\n\n${rows.join("\n")}\n\nTotal: ${total.toFixed(2)}\n\nOrder Desk`};
  state.ok = `${p.id} submitted. The receipt is on its way to ${email}.`;
  state.email = ""; state.typed = {};
}
function run(action){
  state.error = null; state.ok = null;
  try { action(); } catch (e) { state.error = e.message; }
  render();
}

// ---- view -----------------------------------------------------------------------------------------
const emptyArt = () => { const t = document.createElement("div"); t.innerHTML = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="24" width="44" height="28" rx="4" fill="var(--tint)" stroke="var(--brand)" stroke-width="2"/><g fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 32h44M22 24l4-11h12l4 11M27 41h10"/></g></svg>'; return t.firstChild; };
const empty = (h, m) => $("div",{class:"empty",role:"status"}, emptyArt(), $("p",{class:"h"},h), $("p",{class:"m"},m));

function productsPanel(o){
  const units = Object.values(state.typed).reduce((s,q) => s+q, 0);
  const sub = o.items.reduce((s,i) => s + (state.typed[i.id]||0)*i.price, 0);
  const rows = o.items.map(item => {
    const left = available(item), q = state.typed[item.id] || 0, done = left <= 0;
    const input = $("input",{class:"qty",type:"number",min:0,max:left,step:1,value:q,"aria-label":"Quantity of " + item.name,
      oninput:e => {
        const n = parseInt(e.target.value,10);
        const v = Number.isNaN(n) ? 0 : Math.min(Math.max(n,0),left);
        if (v > 0) state.typed[item.id] = v; else delete state.typed[item.id];
        if (!Number.isNaN(n) && n !== v) e.target.value = v;
        refreshFooter();
        e.target.closest(".row").classList.toggle("active", v > 0);
      }});
    return $("li",{class:"row" + (done ? " done" : q > 0 ? " active" : "")},
      $("div",{}, $("p",{class:"nm",style:"margin:0"},item.name), $("p",{class:"mt",style:"margin:0"}, `${money(item.price)} · ${left} of ${item.qty} left`)),
      done ? $("span",{class:"pill"},"All in cart") : input);
  });
  const unitsEl = $("small",{id:"units"}, `${units} unit(s) selected`), subEl = $("b",{id:"sub"}, money(sub));
  const btn = $("button",{class:"btn",id:"add",disabled:units===0,onclick:() => run(addToCart)},"+ Add to cart");
  return $("section",{class:"card","aria-label":"Opportunity products"},
    $("div",{class:"ph"},$("h2",{},"Opportunity products"),$("span",{class:"badge"},o.items.length)),
    $("ul",{},rows), $("div",{class:"foot"}, $("div",{},unitsEl,subEl), btn));
}
function refreshFooter(){
  const o = opp(), units = Object.values(state.typed).reduce((s,q) => s+q, 0);
  document.getElementById("units").textContent = `${units} unit(s) selected`;
  document.getElementById("sub").textContent = money(o.items.reduce((s,i) => s + (state.typed[i.id]||0)*i.price, 0));
  document.getElementById("add").disabled = units === 0;
}
function cartPanel(){
  const d = draft(), lines = d ? d.lines : [];
  const head = $("div",{class:"ph"},$("h2",{},"Cart"),$("span",{class:"badge"},lines.length));
  if (!lines.length) return $("section",{class:"card","aria-label":"Cart"}, head, empty("Your cart is empty","Enter a quantity next to a product and choose Add to cart."));
  const total = lines.reduce((s,l) => s + l.qty*l.price, 0);
  const valid = EMAIL.test(state.email.trim());
  const hint = $("p",{class:"hint",id:"hint",hidden:true},"Enter a valid email address.");
  const send = $("button",{class:"btn full",id:"send",disabled:!valid,onclick:() => run(submit)},"Submit purchase");
  const email = $("input",{type:"email",id:"email",placeholder:"name@company.com",value:state.email,
    oninput:e => { state.email = e.target.value; const ok = EMAIL.test(state.email.trim());
      send.disabled = !ok; hint.hidden = ok || !state.email.trim(); }});
  return $("section",{class:"card","aria-label":"Cart"}, head,
    $("ul",{}, lines.map(l => $("li",{class:"line"},
      $("div",{}, $("p",{class:"nm",style:"margin:0"},l.name), $("p",{class:"mt",style:"margin:0"}, `${l.qty} × ${money(l.price)}`)),
      $("div",{class:"r"}, money(l.qty*l.price), $("button",{class:"icon","aria-label":"Remove " + l.name,title:"Remove " + l.name,
        onclick:() => run(() => { d.lines = d.lines.filter(x => x !== l); if (!d.lines.length) delete state.drafts[state.oppId]; })},"✕"))))),
    $("div",{class:"checkout"}, $("div",{class:"total"},$("span",{},"Total"),$("span",{},money(total))),
      $("label",{for:"email"},"Send the receipt to"), email, hint, send));
}
function historyPanel(){
  const list = state.purchases.filter(p => p.oppId === state.oppId);
  if (!list.length) return null;
  return $("section",{class:"card section hist","aria-label":"Purchases"},
    $("div",{class:"ph"},$("h2",{},"Purchases of this opportunity"),$("span",{class:"badge"},list.length)),
    $("ul",{}, list.map(p => {
      const total = p.lines.reduce((s,l) => s + l.qty*l.price, 0);
      return $("li",{class:"row"},
        $("div",{}, $("p",{class:"nm",style:"margin:0"}, p.id + " ", $("span",{class:"status " + p.status},p.status)),
          $("p",{class:"mt",style:"margin:0"}, `${p.lines.length} line(s) · ${money(total)} · ${p.email}`)),
        p.status === "Submitted" ? $("button",{class:"link",onclick:() => run(() => { p.status = "Cancelled"; state.ok = `${p.id} cancelled. Its units are available again.`; })},"Cancel purchase") : null);
    })));
}
function mailPanel(){
  const m = state.lastMail; if (!m) return null;
  return $("section",{class:"card section","aria-label":"Receipt email"},
    $("div",{class:"ph"},$("h2",{},"Receipt email (preview)")),
    $("div",{class:"mailhead"}, "To ", $("b",{},m.to), " · Subject ", $("b",{},m.subject)),
    $("pre",{class:"mail"},m.body));
}
function render(){
  const app = document.getElementById("app");
  const keepFocus = document.activeElement && document.activeElement.id;
  app.replaceChildren();
  const picker = $("select",{"aria-label":"Opportunity",onchange:e => { state.oppId = e.target.value || null; state.typed = {}; state.error = null; state.ok = null; render(); }},
    $("option",{value:""},"Select an opportunity"),
    OPPS.map(o => $("option",{value:o.id,selected:o.id===state.oppId}, `${o.name} · ${o.account}`)));
  app.append($("header",{class:"card head"},
    $("div",{class:"brand"},$("div",{class:"logo","aria-hidden":"true"},"🛒"),$("div",{},$("h1",{},"Order Desk"),$("p",{class:"sub"},"Pick products from an opportunity, collect them in a cart and send the receipt."))),
    picker));
  if (state.error) app.append($("div",{class:"banner err",role:"alert"},"⚠ " + state.error));
  if (state.ok) app.append($("div",{class:"banner ok",role:"status"},"✓ " + state.ok, $("button",{"aria-label":"Dismiss",onclick:() => { state.ok = null; render(); }},"×")));
  const o = opp();
  if (!o){ app.append($("div",{class:"card"},empty("Select an opportunity","Choose one above to see its products and start a cart."))); return; }
  const cart = draft();
  app.append($("div",{class:"stats"},
    $("div",{class:"card stat"},$("small",{},"Account"),$("span",{},o.account)),
    $("div",{class:"card stat"},$("small",{},"Opportunity"),$("span",{},o.name)),
    $("div",{class:"card stat"},$("small",{},"Cart total"),$("span",{},money(cart ? cart.lines.reduce((s,l) => s + l.qty*l.price, 0) : 0)))));
  app.append($("div",{class:"cols"}, productsPanel(o), cartPanel()));
  for (const extra of [historyPanel(), mailPanel()]) if (extra) app.append(extra);
  if (keepFocus){ const el = document.getElementById(keepFocus); if (el) el.focus(); }
}
render();
</script>
</body>
</html>
